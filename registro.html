<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Crie sua conta na Isabele Mariana Nails para agendar seus serviços.">

  <meta name="theme-color" content="#ffd9e7">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta name="apple-mobile-web-app-title" content="IM Nails">

  <meta property="og:title" content="Cadastro | Isabele Mariana Nails">

  <meta property="og:description" content="Cadastre-se para escolher serviços e agendar seus horários.">

  <meta property="og:type" content="website">

  <title>Cadastro | Isabele Mariana Nails</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="base.css?v=1.0.4">

  <link rel="stylesheet" href="registro.css?v=3.0.0">
</head>

<body data-page="signup">

  <div class="app-container">

    <main class="signup-main">

      <span class="signup-decoration signup-decoration--top" aria-hidden="true"></span>

      <span class="signup-decoration signup-decoration--bottom" aria-hidden="true"></span>

      <header class="signup-header">

        <a href="index.html" class="signup-back-button" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <img src="./assets/logo-isabele-mariana.png" alt="Isabele Mariana Nails" class="signup-logo" width="239" height="167">

      </header>

      <section class="signup-intro" aria-labelledby="signup-title">

        <span class="signup-eyebrow">
          Sua conta
        </span>

        <h1 id="signup-title">
          Crie sua conta.
        </h1>

        <p>
          Preencha seus dados para agendar e acompanhar
          seus atendimentos.
        </p>

      </section>

      <section class="signup-content">

        <form class="signup-form" id="signupForm" novalidate>

          <div class="form-group">

            <label for="nameInput" class="form-label">
              Nome completo
            </label>

            <div class="signup-input-wrapper">

              <span class="signup-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" />

                  <path d="M5 21C5 17.1 8.1 14 12 14C15.9 14 19 17.1 19 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>

              <input type="text" id="nameInput" class="signup-input signup-input--primary" placeholder="Digite seu nome completo" autocomplete="name" aria-label="Nome completo para cadastro" data-action="input-name" required>

            </div>

          </div>

          <div class="form-group">

            <label for="emailInput" class="form-label">
              E-mail
            </label>

            <div class="signup-input-wrapper">

              <span class="signup-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4 6H20V18H4V6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

                  <path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>

              <input type="email" id="emailInput" class="signup-input" placeholder="seu@email.com" autocomplete="email" inputmode="email" aria-label="E-mail para cadastro" data-action="input-email" required>

            </div>

          </div>

          <div class="form-group">

            <label for="phoneInput" class="form-label">
              Celular
            </label>

            <div class="signup-input-wrapper">

              <span class="signup-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M7 3H17C18.1 3 19 3.9 19 5V19C19 20.1 18.1 21 17 21H7C5.9 21 5 20.1 5 19V5C5 3.9 5.9 3 7 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

                  <path d="M10 18H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>

              <input type="tel" id="phoneInput" class="signup-input" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="tel" aria-label="Celular para contato" data-action="input-phone" maxlength="15" required>

            </div>

          </div>

          <div class="signup-password-grid">

            <div class="form-group">

              <label for="passwordInput" class="form-label">
                Senha
              </label>

              <div class="signup-input-wrapper">

                <span class="signup-input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="10" width="14" height="11" rx="3" stroke="currentColor" stroke-width="1.8" />

                    <path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                </span>

                <input type="password" id="passwordInput" class="signup-input" placeholder="Digite sua senha" autocomplete="new-password" aria-label="Senha para cadastro" minlength="8" required>

              </div>

            </div>

            <div class="form-group">

              <label for="confirmPasswordInput" class="form-label">
                Confirmar senha
              </label>

              <div class="signup-input-wrapper">

                <span class="signup-input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="10" width="14" height="11" rx="3" stroke="currentColor" stroke-width="1.8" />

                    <path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

                    <path d="M9.5 15.5L11.2 17L14.8 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>

                <input type="password" id="confirmPasswordInput" class="signup-input" placeholder="Repita sua senha" autocomplete="new-password" aria-label="Confirmação da senha" minlength="8" required>

              </div>

            </div>

          </div>

          <span class="signup-password-helper">
            Use pelo menos 8 caracteres.
          </span>

          <div class="form-group form-group--checkbox">

            <div class="checkbox-wrapper">

              <input type="checkbox" id="termsCheckbox" class="signup-checkbox" aria-label="Concordo com os Termos e Condições" data-action="terms-checkbox" required>

              <label for="termsCheckbox" class="checkbox-label">
                Li e aceito os

                <a href="termos.html" class="signup-link signup-terms-link">
                  Termos de Uso e a Política de Privacidade
                </a>.
              </label>

            </div>

          </div>

          <button type="submit" class="signup-button signup-button--primary" data-action="submit-signup" disabled aria-disabled="true">
            <span>
              Criar conta
            </span>

            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

              <path d="M13 6L19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

        </form>

        <div class="form-divider">
          <span></span>

          <p class="form-divider-text">
            ou
          </p>

          <span></span>
        </div>

        <button type="button" class="signup-button signup-button--google" id="googleSignupBtn" data-action="google-signup" disabled aria-disabled="true">
          <svg class="google-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.79 15.71 17.57V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4" />

            <path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.57C14.73 18.23 13.48 18.63 12 18.63C9.14 18.63 6.71 16.7 5.84 14.1H2.18V16.94C3.99 20.53 7.7 23 12 23Z" fill="#34A853" />

            <path d="M5.84 14.09C5.62 13.43 5.49 12.73 5.49 12C5.49 11.27 5.62 10.57 5.84 9.91V7.07H2.18C1.43 8.55 1 10.22 1 12C1 13.78 1.43 15.45 2.18 16.93L5.03 14.71L5.84 14.09Z" fill="#FBBC05" />

            <path d="M12 5.38C13.62 5.38 15.06 5.94 16.21 7.02L19.36 3.87C17.45 2.09 14.97 1 12 1C7.7 1 3.99 3.47 2.18 7.07L5.84 9.91C6.71 7.31 9.14 5.38 12 5.38Z" fill="#EA4335" />
          </svg>

          <span class="google-text">
            Criar conta com o Google
          </span>
        </button>

        <footer class="signup-footer">

          <p>
            Já possui uma conta?

            <a href="login.html" class="signup-link">
              Entrar
            </a>
          </p>

        </footer>

      </section>

    </main>

  </div>

  <script type="module" src="registro.js?v=2.0.0"></script>

  <script src="app.js?v=2.0.0" defer></script>

</body>

</html>
