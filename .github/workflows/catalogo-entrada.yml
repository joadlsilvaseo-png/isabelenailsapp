name: Validar entrada do catálogo no app
on:
  push:
    branches: [main]
    paths:
      - "catalogoEntrada.mjs"
      - "login.js"
      - "principal.js"
      - "registro.js"
      - "scripts/catalogo-entrada.test.mjs"
      - ".github/workflows/catalogo-entrada.yml"
  pull_request:
    paths:
      - "catalogoEntrada.mjs"
      - "login.js"
      - "principal.js"
      - "registro.js"
      - "scripts/catalogo-entrada.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe dos scripts
        run: |
          node --check login.js
          node --check registro.js
          node --check principal.js
          node --check catalogoEntrada.mjs
      - name: Rotas após autenticação
        run: node --test scripts/catalogo-entrada.test.mjs
