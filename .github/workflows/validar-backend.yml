name: Validar backend Isabele Nails
on:
  push:
    branches:
      - codex/isencao-sinal-pix-por-cliente-20261017
  pull_request:
    paths:
      - "infra/backend/**"
      - "infra/migrations/**"
      - "infra/scripts/**"
      - ".github/workflows/validar-backend.yml"
jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-package-lock --ignore-scripts
      - name: Verificar sintaxe
        run: |
          node --check src/pixCalendarWorker.js
          node --check src/agendaBloqueios.js
          node --check ../../admin-calendario.js
          node --check test/agendamentoCancelamentos.test.js
      - name: Testes do backend
        run: npm test
      - name: Validar script de deploy
        working-directory: .
        run: bash -n infra/scripts/atualizar-vps-pix.sh
