name: Validar backend Isabele Nails
on:
  push:
    branches:
      - codex/isencao-sinal-pix-por-cliente-20261017
  pull_request:
    paths:
      - "infra/backend/**"
      - "scripts/**"
      - "agendamento.js"
      - "agendamento.html"
      - "admin-agendamentos.js"
      - "admin-agendamentos.html"
      - "admin-agendamentos.css"
      - "admin-clientes.js"
      - "admin-clientes.html"
      - "admin-clientes-isabele.css"
      - "admin-clientes-listagem.mjs"
      - "meu-perfil.js"
      - "meu-perfil.html"
      - "meu-perfil.css"
      - "perfilManutencao.mjs"
      - "admin-calendario-regras.mjs"
      - "principal.html"
      - "principal.js"
      - "admin-assistente.html"
      - "admin-assistente.js"
      - "assistenteGestaoCore.mjs"
      - "assistenteGestaoUI.js"
      - "assistenteGestao.css"
      - "service-worker.js"
      - "infra/migrations/**"
      - "infra/scripts/**"
      - ".github/workflows/validar-backend.yml"
jobs:
  validar-imagem-calendar:
    name: Build imagem Calendar sem publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir Docker da API na branch exata
        run: |
          docker build --build-arg APP_REVISION="${{ github.sha }}" \
            -t isabele-nails-api:calendar-ci \
            -f infra/backend/Dockerfile infra/backend
      - name: Verificar scripts operacionais e entrada sem executar API
        run: |
          docker run --rm --entrypoint node isabele-nails-api:calendar-ci \
            --check /app/src/server.js
          docker run --rm --entrypoint node isabele-nails-api:calendar-ci \
            --check /app/scripts/calendarLegacyReview.mjs
  migracao-021:
    name: Migração 021 e reagendamento pago — PostgreSQL 17 temporário
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: isabele_ci
          POSTGRES_PASSWORD: teste_isolado
          POSTGRES_DB: isabele_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isabele_ci -d isabele_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: teste_isolado
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: isabele_ci
      PGDATABASE: isabele_ci
      DATABASE_URL: postgresql://isabele_ci:teste_isolado@localhost:5432/isabele_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências da API
        working-directory: infra/backend
        run: npm install --no-package-lock --ignore-scripts
      - name: Migrar esquema sintético com exclusão de horários
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/backend/test/sql/fixture_reagendamento_pago_pg17.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/007_pix_reservas_horarios.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/021_pix_reagendamentos_pagos.sql
      - name: Validar migração OAuth 023 em PostgreSQL 17 isolado
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/migrations/023_google_calendar_oauth.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/023_google_calendar_oauth.sql
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('google_calendar_oauth_states','google_calendar_oauth_credentials');")" = "2"
      - name: Confirmar preflight e índices de segurança
        run: |
          psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='pix_reagendamentos_pagos';" | grep -qx 27
          psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_indexes WHERE tablename='pix_reagendamentos_pagos' AND indexname IN ('ux_pix_reagendamento_pago_pendente','ix_pix_reagendamento_pago_worker');" | grep -qx 2
      - name: Simular migração 022 com 185 bloqueios legados em banco dedicado
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE isabele_agenda15_ci"
          psql -v ON_ERROR_STOP=1 -d isabele_agenda15_ci -f infra/migrations/018_agenda_bloqueios.sql
          psql -v ON_ERROR_STOP=1 -d isabele_agenda15_ci -f infra/backend/test/sql/fixture_agenda_grade15_pg17.sql
          test "$(psql -v ON_ERROR_STOP=1 -d isabele_agenda15_ci -At -f infra/scripts/agenda-grade15-state.sql)" = "pending"
          psql -v ON_ERROR_STOP=1 -d isabele_agenda15_ci -f infra/migrations/022_agenda_bloqueios_grade_15.sql
          test "$(psql -v ON_ERROR_STOP=1 -d isabele_agenda15_ci -At -f infra/scripts/agenda-grade15-state.sql)" = "applied"
          psql -v ON_ERROR_STOP=1 -d isabele_agenda15_ci -f infra/backend/test/sql/assert_agenda_grade15_pg17.sql
      - name: Testes integrados de pagamento, agendamento, Calendar simulado e recuperação
        run: node --test infra/backend/test/pixReagendamentoPagoPostgres.test.js

  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-package-lock --ignore-scripts
      - name: Verificar sintaxe
        run: |
          node --check src/pixCalendarWorker.js
          node --check scripts/calendarAuditOAuthStageStdin.mjs
          node --check scripts/calendarAuditTemporalStdin.mjs
          node --check scripts/calendarLegacyReview.mjs
          node --check scripts/calendarCanaryStdin.mjs
          node --check scripts/calendarCanaryStatusStdin.mjs
          node --check scripts/calendarThreeExceptionsAuditStdin.mjs
          node --check scripts/calendarThreeExceptionsFixStdin.mjs
          node --check src/googleCalendarDirectBridge.js
          node --check src/googleCalendarNewBookingAuth.js
          node --check src/googleCalendarLegacyCandidates.js
          node --check ../../agendamento.js
          node --check src/pixReagendamentoPago.js
          node --check src/pixReagendamentoPagoOperacao.js
          node --check src/agendamentosIsencaoPix.js
          node --check src/agendaBloqueios.js
          node --check ../../admin-calendario.js
          node --check ../../admin-agendamentos.js
          node --check ../../admin-clientes.js
          node --check ../../meu-perfil.js
          node --check ../../perfilManutencao.mjs
          node --check test/agendamentoCancelamentos.test.js
      - name: Testes do backend
        run: npm test
      - name: Testar modal de conclusão (front-end)
        run: node --test ../../scripts/admin-conclusao-modal.test.mjs
      - name: Testar ordenação e filtro PIX de clientes
        run: node --test ../../scripts/admin-clientes-listagem.test.mjs
      - name: Testar filtros e avatar da agenda administrativa
        run: node --test ../../scripts/admin-agenda-filtros-foto.test.mjs
      - name: Validar interface preventiva do Assistente de Agenda
        run: |
          node --check ../../admin-assistente.js
          node --check ../../admin-bottom-nav.js
          node --test ../../scripts/admin-assistente-ui.test.mjs
      - name: Validar Assistente Isabele no frontend
        run: |
          node --check ../../assistenteGestaoCore.mjs
          node --check ../../assistenteGestaoUI.js
          node --check ../../principal.js
          node --test ../../scripts/assistente-gestao-core.test.mjs ../../scripts/assistente-gestao-ui.test.mjs
      - name: Testar card de manutenção e CTA do Meu Perfil
        run: node --test ../../scripts/perfil-manutencao.test.mjs
      - name: Validar sintaxe dos scripts operacionais (sem executar)
        working-directory: .
        run: |
          bash -n infra/scripts/atualizar-vps-pix.sh
          bash -n infra/scripts/backup-pre-grade-15.sh
          bash -n infra/scripts/calendar-stage-image.sh
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("infra/scripts/calendar-deploy-stage-safe.py").read_text())'
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("infra/scripts/calendar-deploy-upgrade-3b5e9b.py").read_text())'
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("infra/scripts/calendar-deploy-next-safe.py").read_text())'
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("infra/scripts/calendar-cutover-direct-safe.py").read_text())'
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("infra/scripts/calendar-deploy-final-safe.py").read_text())'

  validar-migracao-020-postgresql:
    name: Migração 020 — PostgreSQL 17 temporário
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: isabele_ci
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: isabele_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isabele_ci -d isabele_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: infra/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-package-lock --ignore-scripts
      - name: Verificar migração 020 em PostgreSQL 17 isolado
        env:
          PGTEST_URL: postgres://isabele_ci:ci_local_only@127.0.0.1:5432/isabele_ci
        run: node test/agendamentoAlteracaoServicoPostgres.integration.js

  validar-migracao-024-google-calendar:
    name: Migracao 024 e vinculos Calendar — PostgreSQL 17 isolado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: isabele_ci
          POSTGRES_PASSWORD: teste_isolado
          POSTGRES_DB: isabele_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isabele_ci -d isabele_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: teste_isolado
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: isabele_ci
      PGDATABASE: isabele_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias Node para testes transacionais do Calendar
        working-directory: infra/backend
        run: npm install --no-package-lock --ignore-scripts
      - name: Validar esquema aditivo e reexecucao sem duplicar estruturas
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/migrations/023_google_calendar_oauth.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/024_google_calendar_event_links.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/024_google_calendar_event_links.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/025_google_calendar_lease_fencing.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/025_google_calendar_lease_fencing.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/026_google_calendar_creation_authorizations.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/026_google_calendar_creation_authorizations.sql
      - name: Testar constraints, idempotencia e conciliacao (transacao revertida)
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/backend/test/sql/assert_google_calendar_links_pg17.sql
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT COUNT(*) FROM public.google_calendar_event_links), (SELECT COUNT(*) FROM public.google_calendar_sync_operations), (SELECT COUNT(*) FROM public.google_calendar_reconciliation_candidates);" -F '|')" = "0|0|0"
      - name: Validar transacoes Node e recuperacao de timeout no PG17
        working-directory: infra/backend
        run: node --test test/googleCalendarSafeStore.postgres.test.js
      - name: Simular cutover direto com estado real no PostgreSQL 17
        working-directory: infra/backend
        run: node --test test/googleCalendarDirectBridge.postgres.test.js
      - name: Confirmar indices de seguranca e ausencia de dependencias legadas
        run: |
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('ux_google_calendar_operacao_ativa','idx_google_calendar_operacoes_pendentes','idx_google_calendar_operacoes_lease','idx_google_calendar_candidatos_pendentes','idx_google_calendar_candidatos_evento');")" = "5"
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('pix_calendar_outbox','pix_cobrancas','pix_reservas');")" = "0"
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='google_calendar_sync_operations' AND column_name='lease_token';")" = "1"
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='idx_google_calendar_lease_token';")" = "1"
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='google_calendar_creation_authorizations';")" = "1"
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='idx_google_calendar_autorizacoes_nao_consumidas';")" = "1"
