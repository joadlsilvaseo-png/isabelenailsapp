name: isabele-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: isabele_nails
      POSTGRES_USER: isabele_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Senha obrigatoria}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isabele_admin -d isabele_nails"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped

    environment:
      PORT: "3001"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: isabele_nails
      PGUSER: isabele_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?Senha obrigatoria}
      MP_ENVIRONMENT: ${MP_ENVIRONMENT:-test}
      PIX_TEST_ORDERS_ENABLED: ${PIX_TEST_ORDERS_ENABLED:-false}
      PIX_PRODUCTION_ORDERS_ENABLED: ${PIX_PRODUCTION_ORDERS_ENABLED:-false}
      PIX_CALENDAR_WORKER_ENABLED: ${PIX_CALENDAR_WORKER_ENABLED:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Chave publica obrigatoria}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Chave privada obrigatoria}

      # Firebase Admin SDK
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json

      # Ativaremos somente após os testes
      FIREBASE_WATCH_ENABLED: "true"
      PUSH_WORKER_ENABLED: "false"

    volumes:
      - /opt/isabele-secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
