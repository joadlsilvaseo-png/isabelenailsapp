  <link rel="manifest" href="./manifest.json">

<body data-page="landing">

  <div class="app-container">

    <main class="landing-main">

      <span class="landing-decoration landing-decoration--top" aria-hidden="true"></span>

      <span class="landing-decoration landing-decoration--bottom" aria-hidden="true"></span>

      <header class="landing-header">

        <img src="./assets/logo-isabele-mariana.png" alt="Isabele Mariana Nails" class="landing-logo" width="239" height="167">

      </header>

      <section class="landing-content" aria-labelledby="landing-title">

        <span class="landing-eyebrow">
          Agendamento online
        </span>

        <h1 id="landing-title" class="landing-title">
          Seu momento de cuidado,
          <span>
            do seu jeito.
          </span>
        </h1>

        <p class="landing-description">
          Escolha seu serviço, encontre o melhor horário
          e agende de forma simples.
        </p>

      </section>

      <div class="landing-access">

        <a href="login.html" class="landing-button" data-action="login">
          <span>
            Entrar
          </span>

          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

            <path d="M13 6L19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <p class="landing-signup">
          Ainda não tem uma conta?

          <a href="registro.html" data-action="signup">
            Criar conta
          </a>
        </p>

      </div>

      <footer class="landing-footer">

        <span>
          Isabele Mariana Nails
        </span>

        <i aria-hidden="true"></i>

        <span>
          Agendamento online
        </span>

      </footer>

    </main>

  </div>

  <script type="module" src="analytics.js?v=1.0.1"></script>

  <script type="module" src="index-auth.js?v=1.0.0"></script>
